<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <title>写意 Xieyi</title>
  <desc>面向 Vibe Coding 的参考站：真实可交互组件库 + 概念库，北斗九星导航</desc>
  <defs>
    <style>
      .cat   { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:11px; font-weight:700; letter-spacing:3px; fill:#D4532B; }
      .title { font-family:'STKaiti','KaiTi','楷体','PingFang SC',serif; font-size:96px; font-weight:900; fill:#FFFFFF; }
      .cap   { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; font-weight:500; letter-spacing:6px; fill:#888888; }
      .sub   { font-family:'PingFang SC','Microsoft YaHei',sans-serif; font-size:24px; font-weight:700; fill:#FFFFFF; }
      .tag   { font-family:'PingFang SC','Microsoft YaHei',sans-serif; font-size:15px; font-weight:400; fill:#AAAAAA; }
      .data  { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; }
      .foot  { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:12px; font-weight:400; fill:#666666; }
      .nav   { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; fill:#D4532B; }
      .star  { font-family:'PingFang SC','Microsoft YaHei',sans-serif; font-size:9px; font-weight:400; fill:#9CA3AF; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#111111"/>

  <!-- left accent -->
  <rect x="60" y="48" width="3" height="304" fill="#D4532B"/>
  <rect x="60" y="48" width="620" height="2" fill="#FFFFFF" opacity="0.15"/>
  <rect x="60" y="350" width="620" height="1" fill="#FFFFFF" opacity="0.15"/>

  <!-- LEFT: text -->
  <text x="80" y="92" class="cat">VIBE CODING · 组件与概念库</text>
  <text x="78" y="186" class="title">写意</text>
  <text x="80" y="220" class="cap">XIEYI</text>
  <text x="80" y="262" class="sub">以意运码，码落而器成</text>
  <text x="80" y="292" class="tag">真实可交互的 shadcn 组件库 + 概念库</text>
  <text x="80" y="324" class="data"><tspan fill="#D4532B" font-weight="700">67 组件</tspan><tspan fill="#AAAAAA" font-weight="400">  ·  </tspan><tspan fill="#D4532B" font-weight="700">21 概念</tspan><tspan fill="#AAAAAA" font-weight="400">  ·  </tspan><tspan fill="#D4532B" font-weight="700">⌘K 搜索</tspan><tspan fill="#AAAAAA" font-weight="400">  ·  </tspan><tspan fill="#D4532B" font-weight="700">暗色模式</tspan></text>
  <text x="80" y="370" class="foot">所见即所用 · 真实可交互，而非截图</text>

  <!-- RIGHT: Beidou nine-star navigation (移植自 Hero 区) -->
  <text x="700" y="92" class="nav">NAVIGATION · 北斗九星</text>
  <rect x="678" y="124" width="1" height="220" fill="#FFFFFF" opacity="0.06"/>

  <!-- connecting lines (main 7 stars) -->
  <g stroke="#D4532B" stroke-width="1.5" opacity="0.45" fill="none">
    <line x1="1064" y1="105" x2="1074" y2="250"/>
    <line x1="1074" y1="250" x2="963" y2="270"/>
    <line x1="963" y1="270" x2="939" y2="210"/>
    <line x1="939" y1="210" x2="862" y2="190"/>
    <line x1="862" y1="190" x2="805" y2="170"/>
    <line x1="805" y1="170" x2="733" y2="230"/>
  </g>

  <!-- main stars -->
  <g fill="#D4532B" stroke="#FFFFFF" stroke-width="1">
    <circle cx="1064" cy="105" r="4.5"/>
    <circle cx="1074" cy="250" r="4.5"/>
    <circle cx="963" cy="270" r="4.5"/>
    <circle cx="939" cy="210" r="4.5"/>
    <circle cx="862" cy="190" r="4.5"/>
    <circle cx="805" cy="170" r="4.5"/>
    <circle cx="733" cy="230" r="4.5"/>
  </g>

  <!-- auxiliary stars (faint) -->
  <g fill="#6B7280" stroke="#FFFFFF" stroke-width="0.75">
    <circle cx="747" cy="145" r="3"/>
    <circle cx="790" cy="285" r="3"/>
  </g>

  <!-- star labels (一级分区) -->
  <text x="1074" y="100" class="star" text-anchor="start">首页</text>
  <text x="1084" y="254" class="star" text-anchor="start">基础概念</text>
  <text x="953" y="284" class="star" text-anchor="end">提示词</text>
  <text x="929" y="206" class="star" text-anchor="end">页面画廊</text>
  <text x="852" y="200" class="star" text-anchor="end">词典</text>
  <text x="795" y="164" class="star" text-anchor="end">框架</text>
  <text x="723" y="234" class="star" text-anchor="end">前端组件</text>
  <text x="757" y="142" class="star" text-anchor="start">后端</text>
  <text x="790" y="300" class="star" text-anchor="middle">资源</text>
</svg>
